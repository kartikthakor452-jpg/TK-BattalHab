name: Extract TK BattalHub Project

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o TK_BattalHub_Fresh_Project.zip -d .
          rm TK_BattalHub_Fresh_Project.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git reset -- .github/workflows/build-apk.yml
          git commit -m "Add TK BattalHub project" || echo "No changes to commit"
          git push
